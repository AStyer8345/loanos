[build]
  command   = "mkdir -p public/docs && cp -r docs public/docs && npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NODE_ENV is intentionally NOT set here — Netlify sets it to production during build
  # Setting it manually caused npm to skip devDependencies

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[[plugins]]
  package = "@netlify/plugin-nextjs"
